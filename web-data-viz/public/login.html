<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ComunidadeGC | Login</title>

    <script src="./js/sessao.js"></script>

    <link rel="stylesheet" href="./CSS/cadastro_login.css">
    <link rel="icon" type="image/png" href="./assets/favicon.png">
    <link rel="preconnect" href="https://fonts.gstatic.com" />
</head>

<body>

    <div class="header">
        <div class="logo">
            <img class="img-logo" src="./assets/logo-horizontal.png" alt="Logo da Comunidade Gamecube">
        </div>

        <button onclick="voltar()">Voltar</button>
    </div>

    <div class="main">
        <div class="formulario">
            <div class="form">
                <h2>Login</h2>
                <div style="color: red;" id="div_erro"></div>

                <div class="form-inputs">
                    <h3>Email: </h3>
                    <input type="text" id="ipt_email" placeholder="email@provedor.com">
                </div>

                <div class="form-inputs">
                    <h3>Senha: </h3>
                    <input type="password" id="ipt_senha" placeholder="********">
                </div>
                <a style="align-self: flex-start; margin-left: 8%;" href="">Esqueceu a senha?</a>
                <button style="width: 85%;" onclick="entrar()">Entrar</button>
                <hr class="divisor">
                <p>
                    Não tem uma conta?
                </p>
                <button onclick="cadastro()" class="btn-login">Cadastre-se</button>

            </div>
        </div>
    </div>

</body>

</html>

<script>


    function entrar() {
        // aguardar();

        var emailVar = ipt_email.value;
        var senhaVar = ipt_senha.value;

        if (emailVar == "" || senhaVar == "") {
            div_erro.style.display = "block"
            div_erro.innerHTML = "(Mensagem de erro para todos os campos em branco)";
            finalizarAguardar();
            return false;
        }
        else {
            setInterval(sumirMensagem, 5000)
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;
                    sessionStorage.DTNASC_USUARIO = json.dtNasc;
                    sessionStorage.JOGO_USUARIO = json.jogo;
                    

                    setTimeout(function () {
                        window.location = "./dashboard/cards.html";
                    }, 1000); // apenas para exibir o loading

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    function sumirMensagem() {
        cardErro.style.display = "none"
    }

    function cadastro() {
        window.location.href = "cadastro.html";
    }
    function voltar() {
        window.location.href = "index.html";
    }


</script>
